# Optionale gehärtete Variante: Arcane spricht nicht direkt mit dem Docker-Socket,
# sondern über einen Socket-Proxy mit Allowlist (Tecnativa docker-socket-proxy).
# Statt compose.yaml verwenden:  docker compose -f compose.socketproxy.yaml up -d
# Hinweis: Der Proxy macht Arcane eingeschränkter; bei fehlenden Funktionen (Logs, Terminal, Updates)
# die Flags unten prüfen. Alternative: wollomatic/socket-proxy, Konfiguration über getarcane.app/generator.

name: arcane

services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:v2
    container_name: arcane
    ports:
      - "3552:3552"
    volumes:
      - arcane-data:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      - APP_URL=${APP_URL:-http://localhost:3552}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY in .env setzen}
      - PROJECTS_DIRECTORY=/opt/stacks
      - TZ=Europe/Berlin
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    cgroup: host
    depends_on:
      - docker-socket-proxy
    networks:
      - arcane-net
    restart: unless-stopped
    stop_grace_period: 15s

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: arcane-socket-proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - EVENTS=1
      - PING=1
      - VERSION=1
      - POST=1
      - CONTAINERS=1
      - DISTRIBUTION=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SYSTEM=1
      - VOLUMES=1
      - AUTH=0
      - SECRETS=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - NODES=0
      - PLUGINS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - TASKS=0
    networks:
      - arcane-net
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  arcane-net:
    driver: bridge

volumes:
  arcane-data:
